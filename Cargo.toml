[package]
name = "nyra-sentinel"
version = "0.6.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "NYRA Sentinel by Whyzper.Me — self-hosted security telemetry and bounded AI investigations"

[[bin]]
name = "sentinel-server"
path = "src/main.rs"

[dependencies]
axum = { version = "=0.8.6", features = ["json"] }
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
sqlx = { version = "=0.9.1", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
jiff = { version = "=1.0.1", default-features = false, features = ["std"] }
uuid = { version = "=1.18.1", features = ["v4", "serde"] }
sha2 = "=0.11.1"
hex = "=0.4.3"
subtle = "=2.6.1"
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "rustls-tls"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["fmt", "env-filter", "json"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[[bin]]
name = "sentinel-agent"
path = "src/bin/sentinel-agent.rs"

[[bin]]
name = "sentinel-respond"
path = "src/bin/sentinel-respond.rs"
